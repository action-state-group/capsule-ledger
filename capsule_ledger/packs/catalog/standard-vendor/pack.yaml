# standard-vendor pack: the STANDARD outcome catalog over the GENERAL
# capsule vocabulary ([ldg-bp-standard-vendor-pack], design:
# action-state-ops/_work/backward-judge-buildout/standard-outcome-pack-
# design.md). The airline-engagement pack (A1-A7) is a domain-specific
# DEMO; this pack is deliberately NOT airline voice -- every statement is
# phrased against capsule shapes any emit layer already produces (a stated
# constraint the counterparty emitted, a read chained to a write, a
# citation digest), so ONE pack grades any vendor's ledger: conversational
# (tau2), read-only investigation (Alchemy), coding, sales (design §1/§6).
#
# Rows are organized by the seven-mode axis (design §3): structural (no
# model), value (arithmetic over sealed numbers, no model), judged (an LLM
# reads sealed free text against a digest-pinned prompt), and the four
# fold shapes (fold_rollup / fold_counterparty / fold_agent / fold_cohort)
# -- see schema.MODE_VALUES. `tier` (schema.TIER_VALUES: must_have |
# informational) says whether a row gates a session's job success (§8.2)
# -- no per-term target/ratio is declared here, tier only.
#
# **measurability / evidence_instrument, reused verbatim from the
# airline-engagement pack's A2/A3a/A5 pattern.** Every row below that needs
# a typed, structured capsule field or tool call neither the tau2-bench
# transcripts nor the Alchemy GitHub-thread exports emit today is declared
# `measurability: declared_not_measured` naming the missing
# `evidence_instrument` -- an honest, corpus-checkable claim
# (`capsule_ledger.packs.corpus_verify.verify_declared_not_measured` is the
# oracle), never a silent "inapplicable". Rows tagged `mode: judged` need
# no special instrument -- an LLM judge reads the sealed free text/prose
# every corpus already carries (a conversation turn, an issue comment), so
# those stay `measurability: measured` (the default).
pack_id: asg/standard-vendor/1.0.0

obligations:
  - id: no-duplicate-judge-verdict
    statement: >-
      No judge verdict record may be issued more than once for the same
      closed session.
    check: dedupe

action_semantics:
  - action_type: standard_vendor.session_close
    action_class: info.query
    required_fields: [target]

constraints:
  - wicket_id: standard_vendor.dedupe/1.0.0
    check: dedupe
    config: {}

folds:
  - file: folds/session_close.yaml

outcomes:
  # --- A. Grounding & authority -- structural (design §4 A) --------------
  - id: S1
    statement: "Grounded action: every consequential write chains to a read the agent actually cited."
    evidence_rule: >-
      n/a on today's corpora -- needs a read/observation capsule and a
      write/dispatch capsule where the write's chain_parent points back at
      the read (design §12); neither tau2-bench's free-text transcripts
      nor the Alchemy GitHub-thread exports emit a sealed read-side capsule
      yet ([ldg-bj-emit-read-side-python], queued separately)
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: read_observation_chain_parent
    tier: must_have
    mode: structural

  - id: S2
    statement: "Bounded authority: the agent stayed inside its declared scope -- no write where it was read-only, no action outside its permission."
    evidence_rule: >-
      n/a on today's corpora -- needs a declared authority-scope field
      (what the agent was and was not permitted to write) to compare
      against the write capsules actually observed; neither corpus emits a
      typed scope declaration
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: declared_authority_scope
    tier: must_have
    mode: structural

  - id: S3
    statement: "Sourced claims: every recommendation carries a citation digest to the source it rests on."
    evidence_rule: >-
      n/a on today's corpora -- needs a citation-digest field on a
      recommendation/claim capsule pointing at the source record; neither
      corpus emits a typed citation field today
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: citation_digest
    tier: must_have
    mode: structural

  - id: S4
    statement: "No causation overclaim: this pack never claims the agent caused a resolution, only that a recommendation was made and (separately) that a person acted."
    evidence_rule: >-
      compile-time refusal of the undecomposable causal claim
      (compiler.effect_model.compile_effect_claim) -- always available, no
      corpus dependency
    effect_claim: agent.caused_resolution
    forward_verdict: REFUSED
    backward_verdict: REFUSED
    tier: must_have
    mode: structural

  # --- B. Numeric integrity -- value (design §4 B) ------------------------
  - id: V1
    statement: "Value integrity: a sealed emitted amount or count satisfies its declared bound (e.g. a disclosed figure equals its sealed source, a retry count stays under its configured limit)."
    evidence_rule: >-
      n/a on today's corpora -- needs the typed numeric field itself
      sealed on a capsule, compared arithmetically against its declared
      bound; neither corpus emits a typed amount/count field this pack can
      bind to
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: declared_bound_amount
    tier: must_have
    mode: value

  - id: V2
    statement: "Timeliness: a sealed response or resolution time met its declared threshold."
    evidence_rule: >-
      n/a on today's corpora -- needs a sealed response/resolution
      timestamp pair compared against a declared SLA threshold; neither
      corpus emits a typed, sealed timestamp pair this pack can bind to
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: sealed_response_timestamps
    mode: value

  # --- C. Conduct quality -- judged (design §4 C, the airline A-rows, ----
  # --- generalized) --------------------------------------------------------
  - id: J1
    statement: "Choice, not ultimatum: the agent offered more than one viable path forward, never a single take-it-or-leave-it."
    evidence_rule: >-
      an LLM judge reads the sealed conversation/thread prose against a
      digest-pinned prompt and scores whether >=2 mutually exclusive,
      agent-executable paths were offered -- no typed field needed, only
      the free text every corpus already carries
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    tier: must_have
    mode: judged

  - id: J2
    statement: "Reason before restriction: where the agent applied a limit, it gave the reason before asking the counterparty to accept it."
    evidence_rule: >-
      an LLM judge reads the sealed prose and scores whether the stated
      reason for a limit precedes the ask for acceptance, in that order
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    tier: must_have
    mode: judged

  - id: J3
    statement: "No manufactured pressure: the agent introduced no false urgency or coercion toward a decision."
    evidence_rule: >-
      an LLM judge reads the sealed prose and scores the absence of
      deadline/urgency language not grounded in a cited policy
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    tier: must_have
    mode: judged

  - id: J4
    statement: "Calibrated confidence: the agent expressed appropriate uncertainty and did not bluff."
    evidence_rule: >-
      an LLM judge reads the sealed prose and scores whether expressed
      confidence tracked the agent's actual epistemic state
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    mode: judged

  - id: J5
    statement: "Clean handoff: when the agent escalated or deferred, it handed off cleanly rather than dumping the counterparty."
    evidence_rule: >-
      an LLM judge reads the sealed prose and scores whether an
      escalation/deferral preserved context for whoever picked it up next
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    tier: must_have
    mode: judged

  - id: J6
    statement: "Constraint honored: what the counterparty said they needed was accommodated, not overridden."
    evidence_rule: >-
      an LLM judge reads the sealed prose and scores whether a stated
      counterparty constraint was accommodated rather than overridden
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    tier: must_have
    mode: judged

  # --- D. Job success -- fold_rollup (design §4 D / §8.4) -----------------
  - id: F1
    statement: "Job done right: every applicable must-have outcome held for this session."
    evidence_rule: >-
      per-session rollup (§8.4) over this pack's own must_have-tier
      outcomes' recorded verdicts -- a derived aggregate, not a
      corpus-bound field; arithmetic once its inputs are recorded, no
      model call
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: DETERMINISTIC
    tier: must_have
    mode: fold_rollup

  # --- E. Counterparty-change -- fold_counterparty (design §4 E / §5) ----
  # Each row is a fold over a per-session signal this pack does not yet
  # declare on its own (design §5's two-layer composition;
  # [ldg-bp-counterparty-change-family] wires the signal + fold pair) --
  # min-N gated, correlation-not-cause framed, never re-judging.
  - id: C1
    statement: "Capability growth: the counterparty grew more knowledgeable or self-sufficient across their sessions with this agent."
    evidence_rule: >-
      n/a on today's corpora -- needs a per-counterparty trend over a
      basic-question-count signal across that counterparty's sessions,
      min-N gated; neither corpus emits the per-session signal yet
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: basic_question_count_trend
    mode: fold_counterparty

  - id: C2
    statement: "De-escalation: the counterparty's frustration or hostility trended down across sessions."
    evidence_rule: >-
      n/a on today's corpora -- needs a per-counterparty trend over a
      judged session-sentiment signal, min-N gated; neither corpus emits
      the per-session signal yet
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: session_sentiment_trend
    mode: fold_counterparty

  - id: C3
    statement: "Resolution stuck: repeat contacts on the same issue fell over time -- the fix held."
    evidence_rule: >-
      n/a on today's corpora -- needs a per-counterparty repeat-contact
      count across time, min-N gated; neither corpus emits a typed
      repeat-contact field
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: repeat_contact_count_trend
    mode: fold_counterparty

  - id: C4
    statement: "Guidance adoption: the counterparty increasingly acted on the agent's recommendations over time."
    evidence_rule: >-
      n/a on today's corpora -- needs a per-counterparty trend over the
      recommendation.acted_on effect-claim rate across sessions, min-N
      gated; neither corpus emits the per-session rate yet
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: recommendation_acted_on_rate_trend
    mode: fold_counterparty

  - id: C5
    statement: "Growing autonomy: the counterparty needed less hand-holding -- clarification turns per session trended down."
    evidence_rule: >-
      n/a on today's corpora -- a deterministic signal IF turn roles are
      emitted (a per-session clarification-turn count), folded into a
      per-counterparty trend, min-N gated; neither corpus emits a
      clarification-turn-count field today
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: clarification_turn_count_trend
    mode: fold_counterparty

  - id: C6
    statement: "Trust growth: the counterparty accepted recommendations more readily, and escalated less, over time."
    evidence_rule: >-
      n/a on today's corpora -- needs a per-counterparty trend over an
      acceptance/escalation-rate signal across sessions, min-N gated;
      neither corpus emits the per-session signal yet
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: trust_acceptance_rate_trend
    mode: fold_counterparty

  # --- F. Agent-trajectory -- fold_agent (design §4 F) --------------------
  - id: T1
    statement: "Quality stability: the agent's must-have rates held over the period, no regression."
    evidence_rule: >-
      n/a on today's corpora -- needs a single-population trend over this
      pack's own must_have-tier verdict rates across a period; requires a
      run of sealed judgment capsules over time this pack does not yet have
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: must_have_rate_trend
    mode: fold_agent

  - id: T2
    statement: "Named improvement: a specific outcome's rate rose from one period to the next."
    evidence_rule: >-
      n/a on today's corpora -- needs a single-population, period-over-
      period trend for one named outcome's verdict rate; requires a run of
      sealed judgment capsules over time this pack does not yet have
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: named_outcome_rate_trend
    mode: fold_agent

  # --- G. Cohort comparison -- fold_cohort (design §4 G) ------------------
  - id: X1
    statement: "Cohort comparison: the same standard outcomes compared across two populations (e.g. v2 vs v1, model A vs model B), two coverage lines, never blended."
    evidence_rule: >-
      n/a on today's corpora -- needs a per-unit cohort-partition key
      (e.g. a model_id/version label) to split the fold into two coverage
      lines; neither corpus emits a typed cohort-partition field today
    forward_verdict: UNAVAILABLE-STATE-REQUIRED
    backward_verdict: WITH-INSTRUMENTATION
    measurability: declared_not_measured
    evidence_instrument:
      kind: structured_field
      field: cohort_partition_key
    mode: fold_cohort

bootstrap: AI-BOOTSTRAP.md

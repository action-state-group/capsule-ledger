[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-ledger"
version = "0.0.1"
description = "Local control-plane ledger, verifiable folds, and enforcement guards for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["agent", "ledger", "guard", "fold", "capsule"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Capsule parsing goes through the public agent-action-capsule reference
# library — never vendored into this repo.
#
# checkpointed-local-log -- the `cll` package: the neutral CLL/MMR core
# (append, peak hash, root computation, checkpoint format) plus this
# package's own ledger core (store/admission/chains), graduated OUT of this
# repo per the W3.1 CLL extraction (2026-09-01; action-state-strategy/docs/
# strategy/w3-ledger-dissolution-lib-per-spec-2026-09-01.md). Was consumed
# from capsule_emit.checkpoint per Amendment E (2026-08-21); capsule_ledger.
# ledger.{admission,api,records} and capsule_ledger.mmr.checkpoint are now
# thin sys.modules aliases over cll.ledger.*, and capsule_ledger.ledger.
# store.LedgerStore is a thin subclass over cll.ledger.store.LedgerStore
# (see that module's docstring) that now inherits cll's own default
# time-fenced key-revocation finding rather than layering a second,
# drift-prone copy on top (#126 fix, 2026-09-01). Required, not optional:
# capsule_ledger.cli.bundle_cmd's completeness certificate and every
# ledger/mmr consumer depend on it directly, not just the examples path.
# Pulls in scitt-cose + cbor2 + cryptography transitively (was this
# package's own `checkpoint` extra; that extra is now redundant and removed
# below). NOT YET ON PyPI (2026-09-01) -- see requirements.txt for the
# exact-pin catch-up TODO once it publishes.
#
# capsule-emit -- still needed for capsule_emit.account (fold/account core +
# chain_segment, #132/#133, 0.6.0+) -- NOT for checkpoint anymore, so the
# `[checkpoint]` extra this package used to request from it is dropped.
# Floor stays >=0.6.1 (#125, capsule-emit#128/#135 float tool-arg
# canonicalization fix) even though checkpoint no longer needs it -- account
# still does, and dropping the floor would silently re-permit an unfixed
# capsule-emit.
dependencies = [
    "agent-action-capsule>=0.1.0",
    "capsule-emit>=0.6.1",
    "checkpointed-local-log>=0.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-ledger"
Source = "https://github.com/action-state-group/capsule-ledger"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
capsule = "capsule_ledger.cli:main"
# Hidden alias, undocumented: kept working for one release post-rename to `capsule`.
asg = "capsule_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_ledger*"]

[tool.setuptools.package-data]
capsule_ledger = [
    "bundle_viewer/static/*.html",
    "folds/catalog_defs/*.yaml",
    "guards/wickets/catalog_defs/*.yaml",
    "policy/catalog_defs/*.yaml",
    "vectors/fixtures/kat/*/*.yaml",
    "vectors/fixtures/kat/*/*.jsonl",
    "vectors/fixtures/kat/*/*.json",
    "vectors/fixtures/determinism/*/*.yaml",
    "vectors/fixtures/determinism/*/*.jsonl",
    "vectors/fixtures/determinism/*/*.json",
    "vectors/fixtures/must_fail/*/*.yaml",
    "vectors/fixtures/must_fail/*/*.jsonl",
    "vectors/fixtures/must_fail/*/*.txt",
    "registry/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-ledger"
version = "0.0.1"
description = "Local control-plane ledger, verifiable folds, and enforcement guards for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["agent", "ledger", "guard", "fold", "capsule"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Capsule parsing goes through the public agent-action-capsule reference
# library — never vendored into this repo.
#
# capsule-emit[checkpoint] -- the neutral CLL/MMR core (append, peak hash,
# root computation, checkpoint format) this package consumes from
# capsule_emit.checkpoint rather than forking (Amendment E, 2026-08-21; see
# docs/oss-project-scope.md). Required, not optional: capsule_ledger.cli.
# bundle_cmd's completeness certificate, capsule_ledger.conversation.merkle's
# session digest, and capsule_ledger.mmr.checkpoint's sign/register/verify
# path all depend on it directly, not just the examples path. Floor is
# >=0.6.0 (was >=0.5.1, was 0.4.x): capsule-emit 0.5.1's format-4/jcs
# capsules produce different capsule_id/digest bytes than 0.4.x, so the
# committed fixtures and format-dependent assertions in this repo are
# generated against that format. The floor moves to >=0.6.0 because this
# branch (folds: de-fork onto capsule_emit.account) consumes the new public
# `capsule_emit.account` subpackage, which first ships in capsule-emit 0.6.0
# (#132 fold/account core + #133 chain_segment). 0.6.0 is a superset of 0.5.1's
# format-4/jcs surface -- account core + chain_segment are additive, no capsule
# format field changed -- so no fixture regeneration is required by this bump.
# Pinning the floor at the exact released version prevents silent resolution
# back to a version without `capsule_emit.account`.
dependencies = [
    "agent-action-capsule>=0.1.0",
    "capsule-emit[checkpoint]>=0.6.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-ledger"
Source = "https://github.com/action-state-group/capsule-ledger"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
# capsule_ledger/mmr/checkpoint.py uses scitt-cose for offline COSE receipt
# verification and `cryptography` for Ed25519 key conversion. Both are
# soft-imported (actionable ImportError if absent). Install this extra to
# enable `capsule checkpoint verify` and `verify_receipt_offline`.
checkpoint = ["scitt-cose>=0.2.0", "cryptography>=42.0"]

[project.scripts]
capsule = "capsule_ledger.cli:main"
# Hidden alias, undocumented: kept working for one release post-rename to `capsule`.
asg = "capsule_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_ledger*"]

[tool.setuptools.package-data]
capsule_ledger = [
    "bundle_viewer/static/*.html",
    "console/*.css",
    "console/*.html",
    "console/*.js",
    "telemetry/fixtures/*.jsonl",
    "folds/catalog_defs/*.yaml",
    "guards/wickets/catalog_defs/*.yaml",
    "policy/catalog_defs/*.yaml",
    "vectors/fixtures/kat/*/*.yaml",
    "vectors/fixtures/kat/*/*.jsonl",
    "vectors/fixtures/kat/*/*.json",
    "vectors/fixtures/determinism/*/*.yaml",
    "vectors/fixtures/determinism/*/*.jsonl",
    "vectors/fixtures/determinism/*/*.json",
    "vectors/fixtures/must_fail/*/*.yaml",
    "vectors/fixtures/must_fail/*/*.jsonl",
    "vectors/fixtures/must_fail/*/*.txt",
    "registry/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
